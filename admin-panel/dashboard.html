<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aria Admin — Dashboard</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar topbar--data">
      <nav class="topbar-breadcrumb" aria-label="Trilha">
        <a href="dashboard.html" style="color:inherit;text-decoration:none;font-weight:600" id="dash-bc-panel">Painel</a>
        <span class="topbar-breadcrumb-sep">/</span>
        <span id="dash-bc-summary">Resumo</span>
      </nav>
    </div>
    <div class="page-body">
      <header class="page-hero fade-in">
        <h1 class="page-hero-title" id="dash-hero-title">Dashboard</h1>
        <p class="page-hero-sub" id="dash-hero-sub">
          Visão geral da plataforma: métricas principais, última atividade de auditoria e tenants recentes.
        </p>
      </header>

      <div class="data-toolbar" style="margin-bottom:24px">
        <div class="data-toolbar-main" style="align-items:center;gap:14px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:600;color:var(--text3);" id="last-update">Carregando…</span>
          <a href="audit.html?category=SYSTEM" id="dash-system-events-chip" class="badge badge-gray" style="display:none;text-decoration:none;font-weight:700"></a>
        </div>
        <div class="data-toolbar-actions" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
          <label class="filter-field" style="margin:0;display:flex;align-items:center;gap:8px">
            <span class="filter-field-label" style="margin:0;font-size:11px;white-space:nowrap" id="dash-auto-refresh-lbl">Atualização automática</span>
            <select class="form-control filter-field-control" id="dash-auto-refresh" style="min-width:120px;padding:6px 10px;font-size:12px">
              <option value="0">Desligada</option>
              <option value="60">1 min</option>
              <option value="120">2 min</option>
              <option value="300">5 min</option>
            </select>
          </label>
          <button type="button" class="btn btn-outline btn-sm" id="dash-refresh-btn" title="Recarregar dados do painel">
            <ion-icon name="refresh-outline" style="font-size:17px;vertical-align:-3px" aria-hidden="true"></ion-icon>
            <span class="dash-refresh-label">Atualizar</span>
          </button>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="dashboard-panels-grid">
        <section class="data-shell fade-in" aria-labelledby="dash-panel-activity-title">
          <div class="panel-header">
            <span class="panel-title" style="display:flex;align-items:center;gap:8px">
              <ion-icon name="flash-outline" style="font-size:18px;color:var(--accent)" aria-hidden="true"></ion-icon>
              <span id="dash-panel-activity-title">Atividade recente</span>
            </span>
            <span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">
              <button type="button" class="btn btn-ghost btn-sm" id="dash-audit-all-btn">Ver tudo</button>
              <button type="button" class="btn btn-ghost btn-sm" id="dash-audit-system-btn">Só sistema</button>
            </span>
          </div>
          <div class="data-shell-body" id="activity-list" style="padding-top:12px;padding-bottom:12px">
            <div style="color:var(--text3);font-size:13px;font-weight:500">Carregando…</div>
          </div>
        </section>
      </div>

      <section class="data-shell dashboard-tenants fade-in" aria-labelledby="dash-tenants-section-title">
        <div class="data-table-head">
          <h2 class="data-table-title" style="display:flex;align-items:center;gap:8px;margin:0">
            <ion-icon name="business-outline" style="font-size:18px;color:var(--text3);opacity:0.9" aria-hidden="true"></ion-icon>
            <span id="dash-tenants-section-title">Tenants recentes</span>
          </h2>
          <button type="button" class="btn btn-ghost btn-sm" id="dash-tenants-manage-btn">Gerenciar</button>
        </div>
        <div class="table-wrap">
          <table class="table-data">
            <thead>
              <tr>
                <th id="dash-th-tenant">Tenant</th>
                <th id="dash-th-plan">Plano</th>
                <th id="dash-th-users">Usuários</th>
                <th id="dash-th-assets">Bens</th>
                <th id="dash-th-status">Status</th>
                <th id="dash-th-created">Criado em</th>
              </tr>
            </thead>
            <tbody id="tenants-tbody">
              <tr><td colspan="6" style="text-align:center;padding:28px;color:var(--text3);font-size:13px;font-weight:500">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>
<script type="module">
  import { initPage } from './js/sidebar.js';
  import { CONFIG }   from './js/config.js';
  import {
    applyDashboardStaticI18n,
    dashT,
    dashFormatDate,
    dashFormatDateOnly,
    dashFormatTimeOnly,
    dashFormatNumber,
    dashStatusLabel,
  } from './js/dashboard-i18n.js';

  await initPage();
  applyDashboardStaticI18n();

  const statDefs = [
    { key: 'totalTenants', dashLabelKey: 'dash_stat_tenants', icon: 'business-outline', color: 'var(--accent)', href: 'tenants.html', titleKey: 'dash_stat_go_tenants' },
    { key: 'activeUsers', dashLabelKey: 'dash_stat_users', icon: 'people-outline', color: 'var(--green)', href: 'users.html?active=1', titleKey: 'dash_stat_go_users' },
    { key: 'totalAssets', dashLabelKey: 'dash_stat_assets', icon: 'cube-outline', color: 'var(--blue)', href: null, titleKey: 'dash_stat_go_assets' },
  ];

  const planMap   = { Basic:'badge-gray', Pro:'badge-accent', Enterprise:'badge-blue' };

  const catIcon = { AUTH:'lock-closed-outline', DATA:'stats-chart-outline', ADMIN:'shield-outline', SYSTEM:'settings-outline' };

  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function statStatusClass(status) {
    const s = String(status || '').trim();
    if (s === 'TRIAL') return 'badge-amber';
    if (s === 'ACTIVE') return 'badge-green';
    if (s === 'SUSPENDED') return 'badge-red';
    if (s === 'CANCELLED') return 'badge-gray';
    return 'badge-gray';
  }

  const DASH_AUTO_LS = 'aria_dashboard_autorefresh_sec';
  let dashAutoInt = null;
  function readDashAutoSec() {
    try {
      const v = parseInt(localStorage.getItem(DASH_AUTO_LS) || '0', 10);
      return [0, 60, 120, 300].includes(v) ? v : 0;
    } catch {
      return 0;
    }
  }
  function armDashAutoTimer() {
    clearInterval(dashAutoInt);
    dashAutoInt = null;
    const sec = readDashAutoSec();
    if (sec > 0) dashAutoInt = setInterval(() => { loadDashboard(); }, sec * 1000);
  }

  const dashAutoSel = document.getElementById('dash-auto-refresh');
  if (dashAutoSel) {
    dashAutoSel.value = String(readDashAutoSec());
    dashAutoSel.addEventListener('change', () => {
      const v = parseInt(dashAutoSel.value, 10);
      try {
        if ([0, 60, 120, 300].includes(v)) localStorage.setItem(DASH_AUTO_LS, String(v));
      } catch {
        /* ignore */
      }
      armDashAutoTimer();
    });
  }

  function buildStatCard(s, val) {
    const label = dashT(s.dashLabelKey);
    const title = dashT(s.titleKey);
    const inner = `
        <div class="stat-icon" style="background:${s.color}18;color:${s.color}"><ion-icon name="${s.icon}" style="font-size:20px" aria-hidden="true"></ion-icon></div>
        <div class="stat-value">${dashFormatNumber(val)}</div>
        <div class="stat-label">${escHtml(label)}</div>`;
    if (s.href) {
      const a = document.createElement('a');
      a.className = 'stat-card stat-card--link fade-in';
      a.href = s.href;
      a.style.setProperty('--accent-color', s.color);
      a.setAttribute('title', title);
      a.innerHTML = inner;
      return a;
    }
    const div = document.createElement('div');
    div.className = 'stat-card fade-in';
    div.style.setProperty('--accent-color', s.color);
    div.setAttribute('role', 'group');
    div.setAttribute('aria-label', `${label}: ${dashFormatNumber(val)}`);
    div.title = title;
    div.innerHTML = inner;
    return div;
  }

  window.loadDashboard = async function() {
    const lu = document.getElementById('last-update');
    try {
    const data = await CONFIG.get('/dashboard');
    if (!data || data.error) {
      if (lu) lu.textContent = dashT('dash_load_error');
      const chipErr = document.getElementById('dash-system-events-chip');
      if (chipErr) chipErr.style.display = 'none';
      return;
    }

    const { stats, recentTenants, recentActivity, generatedAt } = data;
    const serverTs = generatedAt ? dashFormatDate(generatedAt) : '—';
    const localClock = dashFormatTimeOnly(new Date());
    if (lu) {
      lu.textContent =
        dashT('dash_last_update_server', { datetime: serverTs }) +
        ' · ' +
        dashT('dash_last_update_local', { time: localClock });
    }

    const sysChip = document.getElementById('dash-system-events-chip');
    if (sysChip) {
      const sysN = Number(stats.systemAuditEvents24h ?? 0);
      sysChip.href = `audit.html?category=${encodeURIComponent('SYSTEM')}`;
      sysChip.textContent = dashT('dash_system_events_24h', { count: dashFormatNumber(sysN) });
      sysChip.title = dashT('dash_system_events_24h_title');
      sysChip.className = sysN > 0 ? 'badge badge-amber' : 'badge badge-gray';
      sysChip.style.display = 'inline-flex';
      sysChip.style.alignItems = 'center';
    }

    const grid = document.getElementById('stat-grid');
    grid.innerHTML = '';
    statDefs.forEach(s => {
      const val = stats[s.key] ?? 0;
      grid.appendChild(buildStatCard(s, val));
    });

    const actList = document.getElementById('activity-list');
    if (!recentActivity || !recentActivity.length) {
      actList.innerHTML = `
        <div class="empty-state-pro" style="padding:28px 16px 24px">
          <ion-icon name="time-outline" style="font-size:44px;opacity:0.35" aria-hidden="true"></ion-icon>
          <div class="empty-state-pro-title">${escHtml(dashT('dash_activity_empty_title'))}</div>
          <p class="empty-state-pro-sub">${escHtml(dashT('dash_activity_empty_sub'))}</p>
        </div>`;
    } else {
      actList.innerHTML = recentActivity.map(a => {
        const tenantName = a.tenant?.name ? String(a.tenant.name) : '';
        const tenantLine = tenantName
          ? `<div class="activity-tenant" style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:2px">${escHtml(dashT('dash_activity_tenant', { name: tenantName }))}</div>`
          : '';
        const catKey = String(a.category || '').toUpperCase();
        const actIcon = catIcon[catKey] || 'flash-outline';
        return `
        <div class="activity-item">
          <div class="activity-icon" style="background:var(--accent-dim)"><ion-icon name="${actIcon}" style="font-size:16px;color:var(--accent)" aria-hidden="true"></ion-icon></div>
          <div class="activity-content">
            ${tenantLine}
            <div class="activity-text"><strong>${escHtml(a.admin?.email || a.user?.email || '—')}</strong> — ${escHtml(a.action)} · <em>${escHtml(a.resource)}</em></div>
            <div class="activity-time">${escHtml(dashFormatDate(a.createdAt))}</div>
          </div>
        </div>`;
      }).join('');
    }

    const tbody = document.getElementById('tenants-tbody');
    if (!recentTenants || !recentTenants.length) {
      tbody.innerHTML = `
        <tr><td colspan="6" style="padding:0;border:none">
          <div class="empty-state-pro" style="padding:36px 20px 32px">
            <ion-icon name="business-outline" aria-hidden="true"></ion-icon>
            <div class="empty-state-pro-title">${escHtml(dashT('dash_tenants_empty_title'))}</div>
            <p class="empty-state-pro-sub">${escHtml(dashT('dash_tenants_empty_sub'))}</p>
          </div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = recentTenants.map(t => {
      const plan = t.subscription?.plan?.name || '—';
      const users = t._count?.users ?? 0;
      const assets = t._count?.assets ?? 0;
      const created = dashFormatDateOnly(t.createdAt);
      const stLabel = dashStatusLabel(t.status);
      const usersHref = t.id ? `users.html?tenantId=${encodeURIComponent(t.id)}` : '';
      const ut = escHtml(dashT('dash_tenant_row_open_users'));
      const nameCell = t.id
        ? `<a href="${escHtml(usersHref)}" title="${ut}" style="color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px">${escHtml(t.name)}</a>`
        : `<span style="font-weight:700">${escHtml(t.name)}</span>`;
      return `<tr>
        <td class="bold">${nameCell} <span style="color:var(--text3);font-weight:400;font-size:10px">${escHtml(t.slug)}</span></td>
        <td><span class="badge ${planMap[plan] || 'badge-gray'}">${escHtml(plan)}</span></td>
        <td>${dashFormatNumber(users)}</td>
        <td>${dashFormatNumber(assets)}</td>
        <td><span class="badge ${statStatusClass(t.status)}">${escHtml(stLabel)}</span></td>
        <td style="color:var(--text3);font-size:11px">${escHtml(created)}</td>
      </tr>`;
    }).join('');
    } finally {
      armDashAutoTimer();
    }
  };

  document.getElementById('dash-refresh-btn')?.addEventListener('click', () => void loadDashboard());
  document.getElementById('dash-audit-all-btn')?.addEventListener('click', () => {
    window.location.href = 'audit.html';
  });
  document.getElementById('dash-audit-system-btn')?.addEventListener('click', () => {
    window.location.href = 'audit.html?category=SYSTEM';
  });
  document.getElementById('dash-tenants-manage-btn')?.addEventListener('click', () => {
    window.location.href = 'tenants.html';
  });

  loadDashboard();
</script>
</body>
</html>
