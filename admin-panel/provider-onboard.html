<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F766E" />
  <title>BrSpark — Onboarding</title>
  <link rel="stylesheet" href="css/brspark-tokens.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --surface: var(--color-surface);
      --bg: var(--color-bg);
      --text: var(--color-slate);
      --text2: var(--color-text-secondary);
      --brand: #0d9488;
      --danger: #b91c1c;
      --ok: #15803d;
      --border: var(--color-border);
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      padding: env(safe-area-inset-top, 0) 16px 24px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 700; text-align: center; margin: 16px 0 8px; }
    .tenant { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 16px; }
    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .intro { font-size: 13px; color: var(--text2); line-height: 1.45; margin-bottom: 12px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 16px 0 10px; }
    .section-title:first-child { margin-top: 0; }
    .field { margin-bottom: 14px; }
    label.f { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      font-size: 15px; font-family: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    input[type="file"] { font-size: 13px; }
    .file-ok { font-size: 12px; color: var(--ok); margin-top: 4px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    button {
      border: none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .stack { display: grid; gap: 10px; margin-top: 20px; }
    .alert {
      padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.45; margin-bottom: 12px;
    }
    .alert-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-success { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
    .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .loading { text-align: center; padding: 40px 16px; color: var(--text2); font-size: 14px; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--brand);
      border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lang-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    .lang-bar button {
      padding: 6px 12px; font-size: 11px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--border);
    }
    .lang-bar button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .hidden { display: none !important; }
    .done-screen .card { text-align: left; }
    .done-screen h2 { font-size: 1.1rem; margin-bottom: 8px; }
    input[readonly], textarea[readonly] {
      background: #f1f5f9;
      color: var(--text2);
    }
    .bind-hint { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="lang-bar" class="lang-bar hidden"></div>
    <div id="view-loading" class="loading hidden">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">…</p>
    </div>
    <div id="view-invalid" class="hidden">
      <div class="alert alert-danger" id="invalid-msg"></div>
    </div>
    <div id="view-done" class="done-screen hidden">
      <div class="card">
        <h2 id="done-title"></h2>
        <p id="done-body" style="font-size:14px;line-height:1.5;color:var(--text2)"></p>
      </div>
    </div>
    <div id="view-main" class="hidden">
      <h1 id="main-title"></h1>
      <p class="tenant hidden" id="main-tenant"></p>
      <div id="banner-error" class="alert alert-danger hidden" role="alert"></div>
      <div class="card" id="main-card">
        <p class="intro" id="main-intro"></p>
        <p class="intro hidden" id="main-email-row"><strong id="lbl-email"></strong> <span id="main-email"></span></p>
        <div id="region-profile" class="hidden"></div>
        <div id="region-integrated" class="hidden"></div>
        <div id="region-didit" class="hidden"></div>
        <div id="region-photos" class="hidden"></div>
        <div id="region-custom" class="hidden"></div>
        <div class="stack">
          <button type="button" class="btn-secondary" id="btn-draft"></button>
          <button type="button" class="btn-primary" id="btn-submit"></button>
        </div>
      </div>
    </div>
  </div>

  function mapTenantLang(code) {
    var l = String(code || '').toLowerCase();
    if (l.indexOf('pt') === 0) return 'pt-BR';
    if (l.indexOf('es') === 0) return 'es';
    if (l.indexOf('de') === 0) return 'de';
    if (l.indexOf('en') === 0) return 'en';
    return 'pt-BR';
  }

  function T(locale, key) {
    var pack = I18N[locale] || I18N['pt-BR'];
    var parts = key.split('.');
    var o = pack;
    for (var i = 0; i < parts.length; i++) {
      o = o && o[parts[i]];
    }
    return typeof o === 'string' ? o : key;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function apiBasePath(token) {
    return '/api/public/provider-affiliation-onboarding/' + encodeURIComponent(token);
  }

  function fetchJson(token, subpath, opts) {
    opts = opts || {};
    var url = apiBasePath(token) + (subpath || '');
    var headers = { Accept: 'application/json' };
    if (opts.body && !(opts.headers && opts.headers['Content-Type'])) {
      headers['Content-Type'] = 'application/json';
    }
    if (opts.headers) {
      for (var k in opts.headers) headers[k] = opts.headers[k];
    }
    return fetch(url, { method: opts.method || 'GET', headers: headers, body: opts.body }).then(function (res) {
      return res.text().then(function (text) {
        var data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { error: text || res.statusText }; }
        if (!res.ok) {
          var err = typeof data.error === 'string' ? data.error : res.statusText;
          throw new Error(err || 'HTTP ' + res.status);
        }
        return data;
      });
    });
  }

  var qs = new URLSearchParams(window.location.search);
  var rawToken = qs.get('token') || '';
  try { rawToken = rawToken ? decodeURIComponent(rawToken) : ''; } catch (e) {}

  var locale = mapTenantLang(qs.get('lng') || qs.get('lang'));
  var boot = null;
  var state = {
    mandatory: {},
    custom: {},
    diditSessionId: '',
    diditVerificationUrl: '',
    diditApproved: false,
    saving: false,
    submitting: false,
    pollTimer: null
  };

  function $(id) { return document.getElementById(id); }

  function show(el, on) {
    if (!el) return;
    el.classList.toggle('hidden', !on);
  }

  function applyLocale(nextLocale) {
    locale = nextLocale;
    document.documentElement.lang = locale === 'pt-BR' ? 'pt-BR' : locale;
    $('loading-text').textContent = T(locale, 'loading');
    $('invalid-msg').textContent = T(locale, 'invalidToken');
    $('main-title').textContent = T(locale, 'title');
    $('main-intro').textContent = T(locale, 'intro');
    $('lbl-email').textContent = T(locale, 'email') + ':';
    $('btn-draft').textContent = T(locale, 'saveDraft');
    $('btn-submit').textContent = T(locale, 'submit');
    $('done-title').textContent = T(locale, 'doneTitle');
    $('done-body').textContent = T(locale, 'doneBody');
    renderLangBar();
    if (boot) renderForm();
  }

  function renderLangBar() {
    var bar = $('lang-bar');
    bar.innerHTML = '';
    var opts = [
      { code: 'pt-BR', label: 'PT' },
      { code: 'en', label: 'EN' },
      { code: 'es', label: 'ES' },
      { code: 'de', label: 'DE' }
    ];
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.label;
      b.className = locale === o.code ? 'on' : '';
      b.onclick = function () { applyLocale(o.code); };
      bar.appendChild(b);
    });
    show(bar, true);
  }

  function stepLabel(step) {
    var key = step.i18nKey || '';
    var short = key.indexOf('providerOnboard.mandatory.') === 0
      ? key.slice('providerOnboard.mandatory.'.length)
      : '';
    if (short && T(locale, 'mandatory.' + short) !== 'mandatory.' + short) {
      return T(locale, 'mandatory.' + short);
    }
    return step.label || step.id;
  }

  function showError(msg) {
    var b = $('banner-error');
    if (!msg) { show(b, false); return; }
    b.textContent = msg;
    show(b, true);
  }

  function renderProfile() {
    var el = $('region-profile');
    el.innerHTML = '';
    var def = boot.definition || {};
    var fields = def.profileFields || [];
    if (!fields.length) {
      show(el, false);
      return;
    }
    show(el, true);
    var h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = T(locale, 'profileSection');
    el.appendChild(h);
    var intro = document.createElement('p');
    intro.className = 'intro';
    intro.textContent = T(locale, 'profileHint');
    el.appendChild(intro);
    var snap = boot.profileSnapshot || {};
    fields.forEach(function (pf) {
      if (!pf || !pf.key) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var lab = document.createElement('label');
      lab.className = 'f';
      var lk = 'profile.' + pf.key;
      var lt = T(locale, lk);
      lab.textContent = lt === lk ? pf.key : lt;
      wrap.appendChild(lab);
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.readOnly = true;
      inp.value = snap[pf.key] != null ? String(snap[pf.key]) : '';
      wrap.appendChild(inp);
      el.appendChild(wrap);
    });
  }

  function renderIntegrated() {
    var el = $('region-integrated');
    el.innerHTML = '';
    var def = boot.definition || {};
    var fields = def.integratedFields || [];
    if (!fields.length) {
      show(el, false);
      return;
    }
    show(el, true);
    var h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = T(locale, 'integratedSection');
    el.appendChild(h);
    var intro = document.createElement('p');
    intro.className = 'intro';
    intro.textContent = T(locale, 'integratedHint');
    el.appendChild(intro);
    var snap = (boot.registrationSnapshot && typeof boot.registrationSnapshot === 'object')
      ? boot.registrationSnapshot
      : {};
    fields.forEach(function (field) {
      if (!field || !field.key) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var lab = document.createElement('label');
      lab.className = 'f';
      var i18 = String(field.i18nKey || '').replace(/^providerOnboard\./, '');
      var lt = T(locale, i18);
      lab.textContent = lt === i18 ? field.key : lt;
      wrap.appendChild(lab);
      var val = snap[field.key] != null ? String(snap[field.key]) : '';
      var inputEl;
      if (field.multiline) {
        inputEl = document.createElement('textarea');
        inputEl.rows = Math.min(14, Math.max(3, val.split('\n').length + 1));
        inputEl.readOnly = true;
        inputEl.value = val;
      } else {
        inputEl = document.createElement('input');
        inputEl.type = 'text';
        inputEl.readOnly = true;
        inputEl.value = val;
      }
      wrap.appendChild(inputEl);
      el.appendChild(wrap);
    });
  }

  function renderDidit() {
    var el = $('region-didit');
    el.innerHTML = '';
    var def = boot.definition || {};
    if (!def.didit || !def.didit.enabled) {
      show(el, false);
      return;
    }
    show(el, true);
    var h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = T(locale, 'diditSection');
    el.appendChild(h);
    var p = document.createElement('p');
    p.className = 'intro';
    p.textContent = T(locale, 'diditHelpShort');
    el.appendChild(p);
    if (state.diditApproved) {
      var ok = document.createElement('div');
      ok.className = 'alert alert-success';
      ok.textContent = T(locale, 'diditApproved');
      el.appendChild(ok);
    } else if (state.diditSessionId) {
      var inf = document.createElement('div');
      inf.className = 'alert alert-info';
      inf.textContent = T(locale, 'diditWaiting');
      el.appendChild(inf);
    }
    var row = document.createElement('div');
    row.className = 'btn-row';
    var b1 = document.createElement('button');
    b1.type = 'button';
    b1.className = 'btn-primary';
    b1.disabled = state.saving;
    b1.textContent = state.diditSessionId ? T(locale, 'diditRestart') : T(locale, 'diditStart');
    b1.onclick = startDidit;
    row.appendChild(b1);
    if (state.diditVerificationUrl) {
      var b2 = document.createElement('button');
      b2.type = 'button';
      b2.className = 'btn-outline';
      b2.textContent = T(locale, 'diditOpenAgain');
      b2.onclick = function () {
        window.open(state.diditVerificationUrl, '_blank', 'noopener,noreferrer');
      };
      row.appendChild(b2);
    }
    el.appendChild(row);
    if (state.diditSessionId) {
      var sid = document.createElement('p');
      sid.className = 'intro';
      sid.innerHTML = '<strong>' + esc(T(locale, 'diditSessionLabel')) + ':</strong> ' + esc(state.diditSessionId);
      el.appendChild(sid);
    }
  }

  function renderPhotos() {
    var el = $('region-photos');
    el.innerHTML = '';
    var def = boot.definition || {};
    if (def.didit && def.didit.enabled) {
      show(el, false);
      return;
    }
    show(el, true);
    var h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = T(locale, 'mandatorySection');
    el.appendChild(h);
    if (def.faceVerificationOnSubmit) {
      var hint = document.createElement('p');
      hint.className = 'intro';
      hint.textContent = T(locale, 'faceVerifyHint');
      el.appendChild(hint);
    }
    var steps = def.mandatorySteps || [];
    steps.forEach(function (step) {
      if (!step || !step.id) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var lab = document.createElement('label');
      lab.className = 'f';
      lab.textContent = stepLabel(step) + (step.required ? ' *' : '');
      wrap.appendChild(lab);
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.dataset.stepId = step.id;
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (f) uploadFile(step.id, f, wrap);
      };
      wrap.appendChild(inp);
      var ok = document.createElement('div');
      ok.className = 'file-ok hidden';
      ok.dataset.okFor = step.id;
      wrap.appendChild(ok);
      el.appendChild(wrap);
      if (state.mandatory[step.id] && state.mandatory[step.id].url) {
        ok.textContent = T(locale, 'fileOk');
        show(ok, true);
      }
    });
  }

  function renderCustom() {
    var el = $('region-custom');
    el.innerHTML = '';
    var fields = (boot.definition && boot.definition.customFields) || [];
    if (!fields.length) {
      show(el, false);
      return;
    }
    show(el, true);
    var h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = T(locale, 'customSection');
    el.appendChild(h);
    var snap = (boot && boot.profileSnapshot) || {};
    fields.forEach(function (field) {
      if (!field || !field.id) return;
      var wrap = document.createElement('div');
      wrap.className = 'field';
      var lab = document.createElement('label');
      lab.className = 'f';
      lab.textContent = (field.label || field.id) + (field.required ? ' *' : '');
      wrap.appendChild(lab);
      var bind = String(field.bindFromProfile || '').trim();
      var boundVal = bind && snap[bind] != null ? String(snap[bind] || '') : '';
      var readOnlyBound = !!(bind && String(boundVal).trim() !== '');
      var inputEl;
      if (field.type === 'textarea') {
        inputEl = document.createElement('textarea');
        inputEl.rows = 3;
      } else {
        inputEl = document.createElement('input');
        inputEl.type = 'text';
      }
      inputEl.placeholder = field.placeholder || '';
      if (readOnlyBound) {
        inputEl.readOnly = true;
        state.custom[field.id] = boundVal;
        inputEl.value = boundVal;
      } else {
        inputEl.value = state.custom[field.id] || '';
      }
      inputEl.dataset.customId = field.id;
      inputEl.oninput = function () {
        if (!inputEl.readOnly) state.custom[field.id] = inputEl.value;
      };
      wrap.appendChild(inputEl);
      if (readOnlyBound) {
        var bh = document.createElement('p');
        bh.className = 'bind-hint';
        bh.textContent = T(locale, 'customAutoFilled');
        wrap.appendChild(bh);
      }
      el.appendChild(wrap);
    });
  }

  function renderForm() {
    var tn = (boot.tenant && (boot.tenant.name || boot.tenant.slug)) || '';
    var tt = $('main-tenant');
    if (tn) {
      tt.textContent = T(locale, 'tenantLabel').replace('{name}', tn);
      show(tt, true);
    } else show(tt, false);
    $('main-email').textContent = boot.providerEmail || '';
    show($('main-email-row'), !!boot.providerEmail);
    renderProfile();
    renderIntegrated();
    renderDidit();
    renderPhotos();
    renderCustom();
  }

  function uploadFile(stepId, file, wrap) {
    state.saving = true;
    updateButtons();
    showError('');
    var fd = new FormData();
    fd.append('file', file);
    fetch(apiBasePath(rawToken) + '/upload', { method: 'POST', body: fd })
      .then(function (res) { return res.json().then(function (j) { return { res: res, j: j }; }); })
      .then(function (_ref) {
        var res = _ref.res;
        var j = _ref.j;
        if (!res.ok) throw new Error(j.error || T(locale, 'uploadFailed'));
        if (!j.url) throw new Error(T(locale, 'uploadFailed'));
        state.mandatory[stepId] = { url: j.url, mimeType: j.mimeType || null };
        var ok = wrap.querySelector('[data-ok-for="' + stepId + '"]');
        if (ok) {
          ok.textContent = T(locale, 'fileOk');
          show(ok, true);
        }
        return patchDraft({ onboardingWeb: { mandatory: (function () {
          var o = {};
          o[stepId] = { url: j.url, mimeType: j.mimeType };
          return o;
        })() } });
      })
      .catch(function (e) {
        showError(e.message || String(e));
      })
      .finally(function () {
        state.saving = false;
        updateButtons();
      });
  }

  function patchDraft(body) {
    return fetchJson(rawToken, '', { method: 'PATCH', body: JSON.stringify(body) });
  }

  function saveDraft() {
    state.saving = true;
    updateButtons();
    showError('');
    var diditPayload = {};
    if (state.diditSessionId) diditPayload.sessionId = state.diditSessionId;
    if (state.diditVerificationUrl) diditPayload.verificationUrl = state.diditVerificationUrl;
    patchDraft({
      onboardingWeb: {
        mandatory: state.mandatory,
        custom: state.custom,
        didit: Object.keys(diditPayload).length ? diditPayload : {}
      }
    })
      .catch(function (e) {
        showError(e.message || String(e));
      })
      .finally(function () {
        state.saving = false;
        updateButtons();
      });
  }

  function submit() {
    state.submitting = true;
    updateButtons();
    showError('');
    var diditPayload = {};
    if (state.diditSessionId) diditPayload.sessionId = state.diditSessionId;
    if (state.diditVerificationUrl) diditPayload.verificationUrl = state.diditVerificationUrl;
    patchDraft({
      onboardingWeb: {
        mandatory: state.mandatory,
        custom: state.custom,
        didit: Object.keys(diditPayload).length ? diditPayload : {}
      }
    })
      .then(function () {
        return fetchJson(rawToken, '/submit', { method: 'POST', body: '{}' });
      })
      .then(function () {
        stopPoll();
        show($('view-main'), false);
        show($('view-done'), true);
      })
      .catch(function (e) {
        showError(e.message || String(e));
      })
      .finally(function () {
        state.submitting = false;
        updateButtons();
      });
  }

  function startDidit() {
    state.saving = true;
    updateButtons();
    showError('');
    fetch(apiBasePath(rawToken) + '/didit-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    })
      .then(function (res) { return res.json().then(function (j) { return { res: res, j: j }; }); })
      .then(function (_ref) {
        var res = _ref.res;
        var j = _ref.j;
        if (!res.ok || !j.ok) throw new Error(j.message || T(locale, 'diditPending'));
        var sid = String(j.sessionId || (j.saved && j.saved.didit && j.saved.didit.sessionId) || '').trim();
        var vurl = String(j.verificationUrl || (j.saved && j.saved.didit && j.saved.didit.verificationUrl) || '').trim();
        if (sid) state.diditSessionId = sid;
        if (vurl) state.diditVerificationUrl = vurl;
        state.diditApproved = false;
        if (vurl) window.open(vurl, '_blank', 'noopener,noreferrer');
        renderForm();
        startPoll();
      })
      .catch(function (e) {
        showError(e.message || String(e));
      })
      .finally(function () {
        state.saving = false;
        updateButtons();
      });
  }

  function pollDidit() {
    if (!rawToken || !(boot && boot.definition && boot.definition.didit && boot.definition.didit.enabled)) return;
    if (!state.diditSessionId) return;
    fetchJson(rawToken, '/didit-status', { method: 'GET' })
      .then(function (j) {
        if (j && j.approved) {
          state.diditApproved = true;
          renderForm();
        }
      })
      .catch(function () {});
  }

  function startPoll() {
    stopPoll();
    state.pollTimer = setInterval(pollDidit, 3500);
  }

  function stopPoll() {
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = null;
  }

  function updateButtons() {
    $('btn-draft').disabled = state.saving || state.submitting;
    $('btn-submit').disabled = state.saving || state.submitting;
  }

  function bootLoad() {
    if (!rawToken) {
      show($('view-loading'), false);
      show($('view-invalid'), true);
      applyLocale(locale);
      return;
    }
    show($('view-loading'), true);
    show($('view-main'), false);
    applyLocale(locale);
    fetchJson(rawToken, '', { method: 'GET' })
      .then(function (data) {
        boot = data;
        if (!qs.get('lng') && !qs.get('lang') && boot.tenant && boot.tenant.defaultLang) {
          applyLocale(mapTenantLang(boot.tenant.defaultLang));
        }
        var saved = boot.saved || {};
        state.mandatory = saved.mandatory && typeof saved.mandatory === 'object' ? Object.assign({}, saved.mandatory) : {};
        state.custom = saved.custom && typeof saved.custom === 'object' ? Object.assign({}, saved.custom) : {};
        var snap = boot.profileSnapshot || {};
        var cf = (boot.definition && boot.definition.customFields) || [];
        cf.forEach(function (f) {
          if (!f || !f.id) return;
          var b = String(f.bindFromProfile || '').trim();
          if (b && snap[b] != null && String(snap[b]).trim() !== '') {
            state.custom[f.id] = String(snap[b]);
          }
        });
        var d = saved.didit && typeof saved.didit === 'object' ? saved.didit : {};
        state.diditSessionId = String(d.sessionId || '').trim();
        state.diditVerificationUrl = String(d.verificationUrl || '').trim();
        state.diditApproved = false;
        show($('view-loading'), false);
        show($('view-main'), true);
        renderForm();
        if (boot.definition && boot.definition.didit && boot.definition.didit.enabled && state.diditSessionId) {
          pollDidit();
          startPoll();
        }
      })
      .catch(function (e) {
        show($('view-loading'), false);
        showError(e.message || String(e));
        show($('view-main'), true);
        $('main-card').querySelector('.stack').classList.add('hidden');
      });
  }

  $('btn-draft').onclick = saveDraft;
  $('btn-submit').onclick = submit;

  bootLoad();
})();
  </script>
</body>
</html>
