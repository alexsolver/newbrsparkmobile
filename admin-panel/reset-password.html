<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrSpark Admin — Redefinir senha</title>
  <link rel="stylesheet" href="/css/brspark-tokens.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .pw-wrap { position: relative; }
    .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; transition: color var(--transition); }
    .pw-toggle:hover { color: var(--text); }
    .reset-success {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--success-bg, rgba(16, 185, 129, 0.12));
      border: 1px solid var(--success-border, rgba(16, 185, 129, 0.3));
      color: var(--success-fg, #047857);
      font-size: 13px;
      line-height: 1.5;
    }
    .reset-success.show { display: block; }
    .login-btn[disabled] { opacity: 0.7; cursor: progress; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg-glow"></div>
    <div class="login-bg-glow2"></div>

    <div class="login-card login-card-wide fade-in">
      <div class="login-logo">
        <img src="img/logo.png" alt="BrSpark Logo">
        <div class="login-logo-text">
          <p>BrSpark</p>
        </div>
      </div>

      <h2 class="login-title">Criar nova senha</h2>
      <p class="login-subtitle">Digite sua nova senha para concluir a recuperação de acesso.</p>
      <!-- Regra: mesma frase que APP_PASSWORD_RULES_USER_FACING_PT em backend/src/lib/appPasswordPolicy.js -->
      <p class="login-subtitle" style="font-size:13px;margin-top:-6px;margin-bottom:14px;line-height:1.45">
        A senha deve ter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma minúscula e um número.
      </p>

      <div class="login-error" id="reset-error">
        <ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon> &nbsp;Não foi possível redefinir a senha.
      </div>
      <div class="reset-success" id="reset-success"></div>

      <form id="reset-password-form">
        <div class="form-group">
          <label class="form-label" for="new-password">Nova senha</label>
          <div class="pw-wrap">
            <input class="form-control" type="password" id="new-password" placeholder="Mín. 8 caracteres, maiúscula, minúscula e número" autocomplete="new-password" required style="padding-right:42px" />
            <button type="button" class="pw-toggle" id="new-password-toggle" title="Mostrar senha"><ion-icon name="eye-outline" style="vertical-align:-2px"></ion-icon></button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirmar nova senha</label>
          <div class="pw-wrap">
            <input class="form-control" type="password" id="confirm-password" placeholder="Repita a nova senha" autocomplete="new-password" required style="padding-right:42px" />
            <button type="button" class="pw-toggle" id="confirm-password-toggle" title="Mostrar senha"><ion-icon name="eye-outline" style="vertical-align:-2px"></ion-icon></button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="reset-password-btn">Salvar nova senha</button>
      </form>

      <p class="login-hint" style="margin-top:16px">
        Lembrou a senha? <a href="/index.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script type="module">
    import { CONFIG, ensureAdminApiDetected } from '/js/config.js';

    await ensureAdminApiDetected();

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    const form = document.getElementById('reset-password-form');
    const errorEl = document.getElementById('reset-error');
    const successEl = document.getElementById('reset-success');
    const submitBtn = document.getElementById('reset-password-btn');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    function bindPasswordToggle(buttonId, inputId) {
      const button = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      button.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        button.innerHTML = isPassword
          ? '<ion-icon name="eye-off-outline" style="vertical-align:-2px"></ion-icon>'
          : '<ion-icon name="eye-outline" style="vertical-align:-2px"></ion-icon>';
      });
    }

    bindPasswordToggle('new-password-toggle', 'new-password');
    bindPasswordToggle('confirm-password-toggle', 'confirm-password');

    function validateAppPasswordPolicy(p) {
      const s = String(p || '');
      if (s.length < 8) {
        return 'A senha deve ter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma minúscula e um número.';
      }
      if (!/[A-Z]/.test(s)) return 'A senha deve incluir pelo menos uma letra maiúscula (A-Z).';
      if (!/[a-z]/.test(s)) return 'A senha deve incluir pelo menos uma letra minúscula (a-z).';
      if (!/[0-9]/.test(s)) return 'A senha deve incluir pelo menos um dígito (0-9).';
      return '';
    }

    if (!token) {
      errorEl.innerHTML = '<ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon>  Link de redefinição inválido.';
      errorEl.classList.add('show');
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      successEl.classList.remove('show');
      successEl.textContent = '';

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!token) {
        errorEl.innerHTML = '<ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon>  Link de redefinição inválido.';
        errorEl.classList.add('show');
        return;
      }
      const pwErr = validateAppPasswordPolicy(newPassword);
      if (pwErr) {
        errorEl.innerHTML = '<ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon>  ' + pwErr;
        errorEl.classList.add('show');
        newPasswordInput.focus();
        return;
      }
      if (newPassword !== confirmPassword) {
        errorEl.innerHTML = '<ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon>  As senhas não conferem.';
        errorEl.classList.add('show');
        confirmPasswordInput.focus();
        return;
      }

      submitBtn.innerHTML = 'Salvando…';
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${CONFIG.API_BASE}/password-reset/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Não foi possível redefinir a senha.');

        successEl.textContent =
          data.message || 'Senha redefinida com sucesso. Redirecionando para o login…';
        successEl.classList.add('show');
        form.reset();
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1800);
      } catch (err) {
        errorEl.innerHTML = '<ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon>  ';
        errorEl.appendChild(document.createTextNode(err && err.message ? String(err.message) : String(err)));
        errorEl.classList.add('show');
      } finally {
        submitBtn.innerHTML = 'Salvar nova senha';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
