<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrSpark Admin — Notificações</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar topbar--data">
      <nav class="topbar-breadcrumb" aria-label="Trilha">
        <a href="dashboard.html" style="color:inherit;text-decoration:none;font-weight:600">Painel</a>
        <span class="topbar-breadcrumb-sep">/</span>
        <span>Notificações</span>
      </nav>
      <div class="topbar-actions">
        <button type="button" class="btn btn-primary" onclick="window.newTemplate()">
          <ion-icon name="add-outline" style="font-size:18px;vertical-align:-3px"></ion-icon>
          Novo template
        </button>
      </div>
    </div>
    <div class="page-body">
      <header class="page-hero fade-in">
        <h1 class="page-hero-title">Notificações</h1>
        <p class="page-hero-sub">
          Modelos por canal (e-mail, push, WhatsApp, SMS) e histórico de envios. Ative ou desative templates sem alterar o conteúdo.
        </p>
      </header>

      <div class="grid-2" style="align-items:start">

        <section class="data-shell fade-in">
          <div class="panel-header">
            <span class="panel-title" style="display:flex;align-items:center;gap:8px">
              <ion-icon name="mail-outline" style="font-size:18px"></ion-icon>
              Templates de notificação
            </span>
            <span class="badge badge-accent" id="tmpl-count">—</span>
          </div>
          <div class="data-shell-body" id="template-list" style="padding-top:8px;padding-bottom:8px">
            <div style="color:var(--text3);font-size:13px;font-weight:500">Carregando…</div>
          </div>
        </section>

        <section class="data-shell fade-in">
          <div class="panel-header">
            <span class="panel-title" style="display:flex;align-items:center;gap:8px">
              <ion-icon name="send-outline" style="font-size:18px"></ion-icon>
              Histórico de envios
            </span>
          </div>
          <div class="data-shell-body" id="log-list" style="padding-top:8px;padding-bottom:8px">
            <div style="color:var(--text3);font-size:13px;font-weight:500">Carregando…</div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>

<!-- Template Modal -->
<div class="modal-overlay" id="template-modal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="modal-title">Novo Template</span><button type="button" class="modal-close" onclick="closeModal('template-modal')"><ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon></button></div>
    <div class="modal-body">
      <input type="hidden" id="tmpl-id" />
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Chave (key)</label><input class="form-control" id="tmpl-key" placeholder="Ex: password_reset" /></div>
        <div class="form-group"><label class="form-label">Label</label><input class="form-control" id="tmpl-label" placeholder="Resetar senha" /></div>
      </div>
      <div class="form-group"><label class="form-label">Canal</label>
        <select class="form-control" id="tmpl-channel">
          <option value="EMAIL">E-mail</option><option value="PUSH">Push</option>
          <option value="WHATSAPP">WhatsApp</option><option value="SMS">SMS</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Assunto (e-mail)</label><input class="form-control" id="tmpl-subject" placeholder="{{name}}, sua senha foi resetada" /></div>
      <div class="form-group"><label class="form-label">Corpo (use {{variavel}} para vars)</label>
        <textarea class="form-control" id="tmpl-body" rows="6" placeholder="Olá {{name}},&#10;&#10;Sua senha foi resetada..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" onclick="closeModal('template-modal')">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-tmpl-btn">Salvar template</button>
    </div>
  </div>
</div>

<script type="module">
  import { initPage } from './js/sidebar.js';
  import { CONFIG }   from './js/config.js';
  await initPage();

  const chanIcon  = { EMAIL:'<ion-icon name="mail-outline"></ion-icon>', PUSH:'<ion-icon name="smartphone-outline"></ion-icon>', WHATSAPP:'<ion-icon name="logo-whatsapp"></ion-icon>', SMS:'<ion-icon name="chatbox-ellipses-outline"></ion-icon>' };
  const statusMap = { SENT:'badge-green', DELIVERED:'badge-blue', FAILED:'badge-red', BOUNCED:'badge-amber' };

  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function loadTemplates() {
    const raw = await CONFIG.get('/notifications/templates');
    if (!raw) return;
    const templates = Array.isArray(raw) ? raw : [];
    document.getElementById('tmpl-count').textContent = `${templates.length} template${templates.length === 1 ? '' : 's'}`;
    document.getElementById('template-list').innerHTML = templates.length
      ? templates.map(t => `
      <div class="flag-item">
        <span class="flag-icon">${chanIcon[t.channel] || chanIcon.EMAIL}</span>
        <div class="flag-info">
          <div class="flag-name">${escHtml(t.label)} <span class="badge badge-gray">${escHtml(t.channel)}</span></div>
          <div class="flag-desc">Chave: <code>${escHtml(t.key)}</code></div>
          ${t.subject ? `<div class="flag-desc" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px">Assunto: ${escHtml(t.subject)}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button type="button" class="btn btn-ghost btn-sm" onclick="editTemplate(${JSON.stringify(t).replace(/"/g, '&quot;')})">Editar</button>
          <label class="toggle">
            <input type="checkbox" ${t.isActive ? 'checked' : ''} onclick="toggleTemplate('${t.id}', this.checked)" />
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>`).join('')
      : `<div class="empty-state-pro" style="padding:24px 16px 20px">
          <ion-icon name="mail-open-outline"></ion-icon>
          <div class="empty-state-pro-title">Nenhum template</div>
          <p class="empty-state-pro-sub">Crie um template com «Novo template».</p>
        </div>`;
  }

  window.newTemplate = () => {
    document.getElementById('modal-title').textContent = 'Novo template';
    document.getElementById('tmpl-id').value = '';
    document.getElementById('tmpl-key').value = '';
    document.getElementById('tmpl-label').value = '';
    document.getElementById('tmpl-channel').value = 'EMAIL';
    document.getElementById('tmpl-subject').value = '';
    document.getElementById('tmpl-body').value = '';
    openModal('template-modal');
  };

  window.editTemplate = (t) => {
    document.getElementById('modal-title').textContent = 'Editar template';
    document.getElementById('tmpl-id').value = t.id;
    document.getElementById('tmpl-key').value = t.key;
    document.getElementById('tmpl-label').value = t.label;
    document.getElementById('tmpl-channel').value = t.channel;
    document.getElementById('tmpl-subject').value = t.subject || '';
    document.getElementById('tmpl-body').value = t.body || '';
    openModal('template-modal');
  };

  window.toggleTemplate = async (id, isActive) => {
    await CONFIG.put(`/notifications/templates/${id}`, { isActive });
  };

  async function loadLogs() {
    const data = await CONFIG.get('/notifications/logs');
    if (!data) return;
    const rows = Array.isArray(data.data) ? data.data : (Array.isArray(data) ? data : []);
    document.getElementById('log-list').innerHTML = rows.length
      ? rows.map(l => `
      <div class="activity-item">
        <div class="activity-icon">${chanIcon[l.channel] || chanIcon.EMAIL}</div>
        <div class="activity-content">
          <div class="activity-text"><strong>${escHtml(l.template?.label || l.templateId)}</strong> → ${escHtml(l.recipient)}</div>
          <div class="activity-time">
            ${new Date(l.sentAt).toLocaleString('pt-BR')}
            <span class="badge ${statusMap[l.status] || 'badge-gray'}">${escHtml(l.status)}</span>
          </div>
        </div>
      </div>`).join('')
      : `<div class="empty-state-pro" style="padding:28px 16px 24px">
          <ion-icon name="paper-plane-outline"></ion-icon>
          <div class="empty-state-pro-title">Nenhum envio registrado</div>
          <p class="empty-state-pro-sub">Os envios aparecem aqui após o sistema processar as filas.</p>
        </div>`;
  }

  loadTemplates();
  loadLogs();

  document.getElementById('save-tmpl-btn').onclick = async () => {
    const id = document.getElementById('tmpl-id').value;
    const body = {
      key:     document.getElementById('tmpl-key').value,
      label:   document.getElementById('tmpl-label').value,
      channel: document.getElementById('tmpl-channel').value,
      subject: document.getElementById('tmpl-subject').value,
      body:    document.getElementById('tmpl-body').value,
    };
    if (!body.key || !body.label || !body.body) return alert('Preencha os campos obrigatórios.');

    if (id) {
       await CONFIG.put(`/notifications/templates/${id}`, body);
    } else {
       await CONFIG.post('/notifications/templates', body);
    }

    closeModal('template-modal');
    loadTemplates();
  };
</script>
<script>
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.modal-overlay').forEach(o =>
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); })
  );
</script>
</body>
</html>
