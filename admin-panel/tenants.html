<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrSpark Admin — Tenants</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar topbar--data">
      <nav class="topbar-breadcrumb" aria-label="Trilha">
        <a href="dashboard.html" id="ten-bc-panel" style="color:inherit;text-decoration:none;font-weight:600">Painel</a>
        <span class="topbar-breadcrumb-sep">/</span>
        <span id="ten-bc-here">Tenants</span>
      </nav>
    </div>
    <div class="page-body">
      <header class="page-hero fade-in">
        <h1 class="page-hero-title" id="ten-hero-title">Gestão de tenants</h1>
        <p class="page-hero-sub" id="ten-hero-sub">
          Contas da plataforma, planos e status. Filtre por nome, plano ou situação; os cartões refletem o resultado atual da lista (até 200 registros).
        </p>
      </header>

      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px" id="tenant-stats"></div>

      <section class="data-shell fade-in">
        <div class="data-toolbar">
          <div class="data-toolbar-main">
            <div class="search-wrap search-wrap--toolbar">
              <span class="search-icon"><ion-icon name="search-outline" style="font-size:16px;vertical-align:middle"></ion-icon></span>
              <input type="search" placeholder="Buscar por nome ou slug…" id="search-input" autocomplete="off" />
            </div>
            <div class="data-toolbar-filters">
              <label class="filter-field">
                <span class="filter-field-label" id="ten-lbl-plan"><ion-icon name="layers-outline"></ion-icon> Plano</span>
                <select class="form-control filter-field-control" id="filter-plan">
                  <option value="">Todos os planos</option>
                  <option>Basic</option><option>Pro</option><option>Enterprise</option>
                </select>
              </label>
              <label class="filter-field">
                <span class="filter-field-label" id="ten-lbl-status"><ion-icon name="flag-outline"></ion-icon> Status</span>
                <select class="form-control filter-field-control" id="filter-status">
                  <option value="">Todos os status</option>
                  <option value="ACTIVE">Ativo</option>
                  <option value="TRIAL">Trial</option>
                  <option value="SUSPENDED">Suspenso</option>
                  <option value="CANCELLED">Cancelado</option>
                </select>
              </label>
            </div>
          </div>
          <div class="data-toolbar-actions">
            <button type="button" class="btn btn-primary" onclick="openModal('new-tenant-modal')">
              <ion-icon name="add-outline" style="font-size:18px;vertical-align:-3px"></ion-icon>
              Novo tenant
            </button>
          </div>
        </div>

        <div class="data-table-head">
          <h2 class="data-table-title" id="ten-table-title">Lista de tenants</h2>
          <span class="badge badge-accent" id="count-badge">—</span>
        </div>
        <div class="table-wrap">
          <table class="table-data">
            <thead>
              <tr>
                <th id="ten-th-slug">Slug</th>
                <th id="ten-th-region">Região</th>
                <th id="ten-th-name">Nome</th>
                <th id="ten-th-plan">Plano</th>
                <th id="ten-th-users">Usuários</th>
                <th id="ten-th-assets">Bens</th>
                <th id="ten-th-status">Status</th>
                <th id="ten-th-created">Criado em</th>
                <th class="text-right" id="ten-th-actions">Ações</th>
              </tr>
            </thead>
            <tbody id="tenants-tbody">
              <tr><td colspan="9" style="text-align:center;padding:28px;color:var(--text3);font-size:13px;font-weight:500">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- New Tenant Modal -->
<div class="modal-overlay" id="new-tenant-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="ten-modal-title">Novo Tenant</span>
      <button type="button" class="modal-close" onclick="closeModal('new-tenant-modal')"><ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label" id="ten-lbl-company">Nome da Empresa *</label><input class="form-control" id="new-name" placeholder="Ex: Benedito Imóveis" /></div>
      <div class="form-group"><label class="form-label" id="ten-lbl-admin-email">E-mail do Admin *</label><input class="form-control" id="new-email" type="email" placeholder="admin@empresa.com" /></div>
      <div class="form-group"><label class="form-label" id="ten-lbl-region">Região/País *</label>
        <select class="form-control" id="new-locale-id"><option value="">Selecione a localização...</option></select>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label" id="ten-lbl-plan-modal">Plano</label>
          <select class="form-control" id="new-plan-id"><option value="">Sem plano</option></select>
        </div>
        <div class="form-group"><label class="form-label" id="ten-lbl-lang">Idioma Padrão</label>
          <select class="form-control" id="new-lang"><option value="pt-BR">pt-BR</option><option value="en-US">en-US</option><option value="es-ES">es-ES</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" id="ten-modal-cancel" onclick="closeModal('new-tenant-modal')">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-tenant-btn"><span id="ten-modal-save">Criar Tenant</span></button>
    </div>
  </div>
</div>

<script>
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.modal-overlay').forEach(o =>
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); })
  );
</script>
<script type="module">
  import { initPage } from './js/sidebar.js';
  import { CONFIG }   from './js/config.js';
  import { applyTenantsPageI18n, tenantsStatusLabel, mpT, mpIntlLocale } from './js/menu-pages-i18n.js';

  await initPage();
  applyTenantsPageI18n();

  const statusMap = { TRIAL:'badge-amber', ACTIVE:'badge-green', SUSPENDED:'badge-red', CANCELLED:'badge-gray' };
  const planMap   = { Basic:'badge-gray', Pro:'badge-accent', Enterprise:'badge-blue' };
  const flags     = { BR:'🇧🇷', US:'🇺🇸', ES:'🇪🇸', AR:'🇦🇷', CL:'🇨🇱', MX:'🇲🇽', PT:'🇵🇹' };

  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const [planData, localeData] = await Promise.all([
    CONFIG.get('/plans'),
    CONFIG.get('/i18n/entries?source=locales')
  ]);

  const planSel   = document.getElementById('new-plan-id');
  const localeSel = document.getElementById('new-locale-id');

  (planData || []).forEach(p => { planSel.innerHTML += `<option value="${escHtml(p.id)}">${escHtml(p.name)} — R$ ${Number(p.priceMonthly).toFixed(0)}${mpT('ten_plan_per_mo')}</option>`; });
  (localeData || []).forEach(l => { localeSel.innerHTML += `<option value="${escHtml(l.id)}">${flags[l.countryCode] || '🌐'} ${escHtml(l.name)} (${escHtml(l.countryCode)})</option>`; });

  function applyTenantsUrlFilters() {
    try {
      const sp = new URL(window.location.href).searchParams;
      const q = sp.get('q');
      if (q != null) document.getElementById('search-input').value = q;
      const plan = sp.get('plan');
      if (plan != null) document.getElementById('filter-plan').value = plan;
      const status = sp.get('status');
      if (status != null) document.getElementById('filter-status').value = status;
    } catch {
      /* ignore */
    }
  }

  function syncTenantsUrl() {
    try {
      const params = new URLSearchParams();
      const q = document.getElementById('search-input').value.trim();
      if (q) params.set('q', q);
      const plan = document.getElementById('filter-plan').value;
      if (plan) params.set('plan', plan);
      const status = document.getElementById('filter-status').value;
      if (status) params.set('status', status);
      const u = new URL(window.location.href);
      window.history.replaceState({}, '', u.pathname + (params.toString() ? `?${params}` : '') + u.hash);
    } catch {
      /* ignore */
    }
  }

  applyTenantsUrlFilters();

  async function loadTenants() {
    const q      = document.getElementById('search-input').value.trim();
    const plan   = document.getElementById('filter-plan').value;
    const status = document.getElementById('filter-status').value;
    const params = new URLSearchParams({ limit: 200 });
    if (q) params.set('q', q);
    if (plan) params.set('plan', plan);
    if (status) params.set('status', status);

    const data = await CONFIG.get(`/tenants?${params}`);
    if (!data) {
      syncTenantsUrl();
      return;
    }
    const tenants = data.data || [];

    const total  = data.total || tenants.length;
    const active = tenants.filter(t => t.status === 'ACTIVE').length;
    const trial  = tenants.filter(t => t.status === 'TRIAL').length;
    const susp   = tenants.filter(t => t.status === 'SUSPENDED').length;

    document.getElementById('tenant-stats').innerHTML = [
      { label: mpT('ten_stat_total'), value: total,  icon:'business-outline', color:'var(--accent)' },
      { label: mpT('ten_stat_active'), value: active, icon:'checkmark-circle-outline', color:'var(--green)'  },
      { label: mpT('ten_stat_trial'), value: trial,  icon:'time-outline',  color:'var(--amber)'  },
      { label: mpT('ten_stat_susp'), value: susp, icon:'ban-outline', color:'var(--red)'    },
    ].map(s => `<div class="stat-card fade-in" style="--accent-color:${s.color}">
      <div class="stat-icon" style="background:${s.color}18;color:${s.color}"><ion-icon name="${s.icon}" style="font-size:18px;vertical-align:-2px"></ion-icon></div>
      <div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join('');

    document.getElementById('count-badge').textContent =
      total === 1 ? mpT('ten_count_one') : mpT('ten_count_many', { n: total });

    const tbody = document.getElementById('tenants-tbody');
    if (!tenants.length) {
      tbody.innerHTML = `
        <tr><td colspan="9" style="padding:0;border:none">
          <div class="empty-state-pro" style="padding:36px 20px 32px">
            <ion-icon name="business-outline"></ion-icon>
            <div class="empty-state-pro-title">${mpT('ten_empty_title')}</div>
            <p class="empty-state-pro-sub">${mpT('ten_empty_sub')}</p>
          </div>
        </td></tr>`;
      syncTenantsUrl();
      return;
    }

    tbody.innerHTML = tenants.map(t => {
      const planName = t.subscription?.plan?.name || '—';
      const users   = t._count?.users ?? 0;
      const assets  = t._count?.assets ?? 0;
      const localeHtml = t.locale
        ? `${flags[t.locale.countryCode] || '🌐'} ${escHtml(t.locale.name)}`
        : `<span style="color:var(--text3)">${mpT('ten_undefined_region')}</span>`;
      const created = new Date(t.createdAt).toLocaleDateString(mpIntlLocale());
      const isActive = t.status === 'ACTIVE' || t.status === 'TRIAL';
      const idAttr = escHtml(t.id);
      return `<tr>
        <td class="mono" style="font-size:10px;color:var(--text3)">${escHtml(t.slug)}</td>
        <td>${localeHtml}</td>
        <td class="bold">${escHtml(t.name)}</td>
        <td><span class="badge ${planMap[planName] || 'badge-gray'}">${escHtml(planName)}</span></td>
        <td>${users}</td>
        <td>${assets.toLocaleString(mpIntlLocale())}</td>
        <td><span class="badge ${statusMap[t.status] || 'badge-gray'}">${escHtml(tenantsStatusLabel(t.status) || t.status)}</span></td>
        <td style="color:var(--text3);font-size:11px">${created}</td>
        <td class="text-right">
          ${isActive
            ? `<button type="button" class="btn btn-danger btn-sm" onclick="toggleStatus('${idAttr}','SUSPENDED')">${mpT('ten_row_suspend')}</button>`
            : `<button type="button" class="btn btn-success btn-sm" onclick="toggleStatus('${idAttr}','ACTIVE')">${mpT('ten_row_activate')}</button>`}
        </td>
      </tr>`;
    }).join('');
    syncTenantsUrl();
  }

  window.toggleStatus = async (id, status) => {
    await CONFIG.patch(`/tenants/${id}/status`, { status });
    loadTenants();
  };

  document.getElementById('save-tenant-btn').onclick = async () => {
    const body = {
      name:        document.getElementById('new-name').value.trim(),
      email:       document.getElementById('new-email').value.trim(),
      localeId:    document.getElementById('new-locale-id').value,
      defaultLang: document.getElementById('new-lang').value,
      planId:      document.getElementById('new-plan-id').value || undefined,
    };
    if (!body.name || !body.email || !body.localeId) return alert(mpT('ten_alert_required'));
    const res = await CONFIG.post('/tenants', body);
    if (res) { closeModal('new-tenant-modal'); loadTenants(); }
  };

  let debounce;
  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => loadTenants(), 300);
  });
  document.getElementById('filter-plan').addEventListener('change', loadTenants);
  document.getElementById('filter-status').addEventListener('change', loadTenants);

  loadTenants();
</script>
</body>
</html>
