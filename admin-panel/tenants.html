<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrSpark Admin — Tenants</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">Tenants</span>
      <div class="topbar-actions">
        <div class="search-wrap"><span class="search-icon"><ion-icon name="time-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon></span><input type="text" placeholder="Buscar tenant…" id="search-input" /></div>
        <select class="form-control" style="width:130px;padding:7px 10px;font-size:12px" id="filter-plan">
          <option value="">Todos os planos</option>
          <option>Basic</option><option>Pro</option><option>Enterprise</option>
        </select>
        <select class="form-control" style="width:130px;padding:7px 10px;font-size:12px" id="filter-status">
          <option value="">Todos os status</option>
          <option value="ACTIVE">Ativo</option>
          <option value="TRIAL">Trial</option>
          <option value="SUSPENDED">Suspenso</option>
          <option value="CANCELLED">Cancelado</option>
        </select>
        <button class="btn btn-primary" onclick="openModal('new-tenant-modal')">+ Novo Tenant</button>
      </div>
    </div>
    <div class="page-body">
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px" id="tenant-stats"></div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Todos os Tenants</span>
          <span class="badge badge-accent" id="count-badge">— tenants</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Slug</th><th>Região</th><th>Nome</th><th>Plano</th><th>Usuários</th><th>Bens</th><th>Status</th><th>Criado em</th><th style="text-align:right">Ações</th>
            </tr></thead>
            <tbody id="tenants-tbody"><tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text3)">Carregando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New Tenant Modal -->
<div class="modal-overlay" id="new-tenant-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Novo Tenant</span>
      <button class="modal-close" onclick="closeModal('new-tenant-modal')"><ion-icon name="close-outline" style="vertical-align:-2px"></ion-icon></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Nome da Empresa *</label><input class="form-control" id="new-name" placeholder="Ex: Benedito Imóveis" /></div>
      <div class="form-group"><label class="form-label">E-mail do Admin *</label><input class="form-control" id="new-email" type="email" placeholder="admin@empresa.com" /></div>
      <div class="form-group"><label class="form-label">Região/País *</label>
        <select class="form-control" id="new-locale-id"><option value="">Selecione a localização...</option></select>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Plano</label>
          <select class="form-control" id="new-plan-id"><option value="">Sem plano</option></select>
        </div>
        <div class="form-group"><label class="form-label">Idioma Padrão</label>
          <select class="form-control" id="new-lang"><option value="pt-BR">pt-BR</option><option value="en-US">en-US</option><option value="es-ES">es-ES</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('new-tenant-modal')">Cancelar</button>
      <button class="btn btn-primary" id="save-tenant-btn">Criar Tenant</button>
    </div>
  </div>
</div>

<script>
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.modal-overlay').forEach(o =>
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); })
  );
</script>
<script type="module">
  import { initPage } from './js/sidebar.js';
  import { CONFIG }   from './js/config.js';
  initPage();

  const statusMap = { TRIAL:'badge-amber', ACTIVE:'badge-green', SUSPENDED:'badge-red', CANCELLED:'badge-gray' };
  const statusLbl = { TRIAL:'Trial', ACTIVE:'Ativo', SUSPENDED:'Suspenso', CANCELLED:'Cancelado' };
  const planMap   = { Basic:'badge-gray', Pro:'badge-accent', Enterprise:'badge-blue' };
  const flags     = { BR:'🇧🇷', US:'🇺🇸', ES:'🇪🇸', AR:'🇦🇷', CL:'🇨🇱', MX:'🇲🇽', PT:'🇵🇹' };

  // Load plans and locales for modal
  const [planData, localeData] = await Promise.all([
    CONFIG.get('/plans'),
    CONFIG.get('/i18n/entries?source=locales')
  ]);
  
  const planSel   = document.getElementById('new-plan-id');
  const localeSel = document.getElementById('new-locale-id');
  
  (planData || []).forEach(p => { planSel.innerHTML += `<option value="${p.id}">${p.name} — R$ ${Number(p.priceMonthly).toFixed(0)}/mês</option>`; });
  (localeData || []).forEach(l => { localeSel.innerHTML += `<option value="${l.id}">${flags[l.countryCode] || '<ion-icon name="globe-outline" style="vertical-align:-2px"></ion-icon>'} ${l.name} (${l.countryCode})</option>`; });

  async function loadTenants() {
    const q      = document.getElementById('search-input').value;
    const plan   = document.getElementById('filter-plan').value;
    const status = document.getElementById('filter-status').value;
    const params = new URLSearchParams({ limit: 200 });
    if (q) params.set('q', q);
    if (plan) params.set('plan', plan);
    if (status) params.set('status', status);

    const data = await CONFIG.get(`/tenants?${params}`);
    if (!data) return;
    const tenants = data.data || [];

    const total  = data.total || tenants.length;
    const active = tenants.filter(t => t.status === 'ACTIVE').length;
    const trial  = tenants.filter(t => t.status === 'TRIAL').length;
    const susp   = tenants.filter(t => t.status === 'SUSPENDED').length;

    document.getElementById('tenant-stats').innerHTML = [
      { label:'Total',     value:total,  icon:'<ion-icon name="business-outline" style="vertical-align:-2px"></ion-icon>', color:'var(--accent)' },
      { label:'Ativos',    value:active, icon:'<ion-icon name="checkmark-circle" style="color:var(--green);vertical-align:-2px"></ion-icon>', color:'var(--green)'  },
      { label:'Trial',     value:trial,  icon:'◐',  color:'var(--amber)'  },
      { label:'Suspensos', value:susp,   icon:'<ion-icon name="ban-outline" style="vertical-align:-2px"></ion-icon>', color:'var(--red)'    },
    ].map(s => `<div class="stat-card" style="--accent-color:${s.color}">
      <div class="stat-icon" style="background:${s.color}18;color:${s.color}">${s.icon}</div>
      <div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join('');

    document.getElementById('count-badge').textContent = `${total} tenants`;

    const tbody = document.getElementById('tenants-tbody');
    if (!tenants.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text3)">Nenhum tenant cadastrado.</td></tr>';
      return;
    }
    tbody.innerHTML = tenants.map(t => {
      const plan    = t.subscription?.plan?.name || '—';
      const users   = t._count?.users ?? 0;
      const assets  = t._count?.assets ?? 0;
      const locale  = t.locale ? `${flags[t.locale.countryCode] || '<ion-icon name="globe-outline" style="vertical-align:-2px"></ion-icon>'} ${t.locale.name}` : '<span style="color:var(--text3)">Não definido</span>';
      const created = new Date(t.createdAt).toLocaleDateString('pt-BR');
      const isActive = t.status === 'ACTIVE' || t.status === 'TRIAL';
      return `<tr>
        <td class="mono" style="font-size:10px;color:var(--text3)">${t.slug}</td>
        <td>${locale}</td>
        <td class="bold">${t.name}</td>
        <td><span class="badge ${planMap[plan] || 'badge-gray'}">${plan}</span></td>
        <td>${users}</td>
        <td>${assets.toLocaleString('pt-BR')}</td>
        <td><span class="badge ${statusMap[t.status] || 'badge-gray'}">${statusLbl[t.status] || t.status}</span></td>
        <td style="color:var(--text3);font-size:11px">${created}</td>
        <td style="text-align:right">
          ${isActive
            ? `<button class="btn btn-danger btn-sm" onclick="toggleStatus('${t.id}','SUSPENDED')">Suspender</button>`
            : `<button class="btn btn-success btn-sm" onclick="toggleStatus('${t.id}','ACTIVE')">Ativar</button>`}
        </td>
      </tr>`;
    }).join('');
  }

  window.toggleStatus = async (id, status) => {
    await CONFIG.patch(`/tenants/${id}/status`, { status });
    loadTenants();
  };

  document.getElementById('save-tenant-btn').onclick = async () => {
    const body = {
      name:        document.getElementById('new-name').value.trim(),
      email:       document.getElementById('new-email').value.trim(),
      localeId:    document.getElementById('new-locale-id').value,
      defaultLang: document.getElementById('new-lang').value,
      planId:      document.getElementById('new-plan-id').value || undefined,
    };
    if (!body.name || !body.email || !body.localeId) return alert('Campos obrigatórios: Nome, E-mail e Região.');
    const res = await CONFIG.post('/tenants', body);
    if (res) { closeModal('new-tenant-modal'); loadTenants(); }
  };

  loadTenants();
  document.getElementById('search-input').addEventListener('input', loadTenants);
  document.getElementById('filter-plan').addEventListener('change', loadTenants);
  document.getElementById('filter-status').addEventListener('change', loadTenants);
</script>
</body>
</html>
