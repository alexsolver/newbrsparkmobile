<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrSpark Admin — Auditoria</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">Log de Auditoria</span>
      <div class="topbar-actions">
        <select class="form-control" style="width:140px;padding:7px 10px;font-size:12px" id="filter-cat">
          <option value="">Todas as ações</option>
          <option value="AUTH">Autenticação</option><option value="DATA">Dados</option>
          <option value="ADMIN">Admin</option><option value="SYSTEM">Sistema</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="export-btn"><ion-icon name="download-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Exportar CSV</button>
      </div>
    </div>
    <div class="page-body">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Eventos do Sistema</span>
          <span class="badge badge-accent" id="count-badge">Carregando…</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Timestamp</th><th>Ator</th><th>Ação</th><th>Recurso</th><th>Tenant</th><th>Categoria</th></tr></thead>
            <tbody id="audit-tbody"><tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Carregando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
  import { initPage } from './js/sidebar.js';
  import { CONFIG } from './js/config.js';
  initPage();

  const catMap   = { AUTH:'badge-blue', DATA:'badge-green', ADMIN:'badge-accent', SYSTEM:'badge-amber' };
  const catLabel = { AUTH:'<ion-icon name="lock-closed-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Auth', DATA:'<ion-icon name="stats-chart-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Dados', ADMIN:'<ion-icon name="shield-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Admin', SYSTEM:'<ion-icon name="settings-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Sistema' };

  async function loadLogs() {
    const cat = document.getElementById('filter-cat').value;
    const url = `/audit${cat ? `?category=${cat}` : ''}`;
    const data = await CONFIG.get(url);
    if (!data) return;
    document.getElementById('count-badge').textContent = `${data.total} eventos`;
    document.getElementById('audit-tbody').innerHTML = data.data.map(l => {
      const actor = l.admin?.email || l.user?.email || 'sistema';
      const ts = new Date(l.createdAt).toLocaleString('pt-BR');
      return `<tr>
        <td class="mono" style="font-size:10px;color:var(--text3);white-space:nowrap">${ts}</td>
        <td style="font-size:11px">${actor}</td>
        <td><code style="font-size:10px;background:var(--surface3);padding:2px 6px;border-radius:4px;color:var(--text);font-weight:700">${l.action}</code></td>
        <td style="font-size:11px;color:var(--text2)">${l.resource}</td>
        <td style="font-size:11px;color:var(--text3)">${l.tenant?.name || '—'}</td>
        <td><span class="badge ${catMap[l.category]}">${catLabel[l.category]}</span></td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Nenhum evento encontrado.</td></tr>';
  }

  loadLogs();
  document.getElementById('filter-cat').addEventListener('change', loadLogs);
  
  document.getElementById('export-btn').onclick = async () => {
    const data = await CONFIG.get('/audit?limit=1000');
    if (!data?.data) return;
    
    const headers = ['Timestamp', 'Ator', 'Ação', 'Recurso', 'Tenant', 'Categoria'];
    const rows = data.data.map(l => [
      new Date(l.createdAt).toLocaleString('pt-BR'),
      l.admin?.email || l.user?.email || 'sistema',
      l.action,
      l.resource,
      l.tenant?.name || '---',
      l.category
    ]);

    const csvContent = [headers, ...rows].map(r => r.join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `brspark_audit_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
  };
</script>
</body>
</html>
