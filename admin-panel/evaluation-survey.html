<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliação de serviço — BrSpark</title>
  <meta name="theme-color" content="#EA580C" />
  <link rel="stylesheet" href="css/brspark-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: var(--color-bg);
      --card: var(--color-surface);
      --accent: var(--color-brand-accent);
      --text: var(--color-slate);
      --muted: var(--color-text-light);
      --border: var(--color-border);
      --ok-fg: var(--color-status-success-fg);
      --err-fg: var(--color-status-danger-fg);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 48px;
      line-height: 1.5;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }
    label.q { display: block; font-weight: 700; margin-bottom: 10px; font-size: 0.95rem; }
    .stars { display: flex; gap: 8px; flex-wrap: wrap; }
    .stars button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .stars button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .stars button.on { border-color: var(--accent); background: var(--color-status-warning-bg); color: var(--accent); }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: var(--card);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, #fff); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: var(--err-fg); font-size: 0.9rem; margin-top: 8px; }
    .ok { color: var(--ok-fg); font-weight: 700; padding: 16px; text-align: center; }
    .nps { display: flex; flex-wrap: wrap; gap: 6px; }
    .nps button {
      min-width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-weight: 700;
    }
    .nps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nps button.on { background: var(--color-status-warning-bg); border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Avaliação de serviço</h1>
    <p class="sub" id="sub">Carregando…</p>
    <div id="form-root"></div>
    <p class="err" id="err" style="display:none"></p>
    <div id="done" class="ok" style="display:none">Obrigado. Sua avaliação foi registrada.</div>
  </div>
  <script>
    const API = window.location.origin + '/api';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const state = { form: null, answers: {} };

    function showErr(msg) {
      const e = document.getElementById('err');
      e.style.display = msg ? 'block' : 'none';
      e.textContent = msg || '';
    }

    function renderQuestion(q) {
      const id = q.id;
      const wrap = document.createElement('div');
      wrap.className = 'card';
      const lab = document.createElement('label');
      lab.className = 'q';
      lab.textContent = (q.required ? '* ' : '') + q.text;
      wrap.appendChild(lab);

      if (q.type === 'RATING') {
        const row = document.createElement('div');
        row.className = 'stars';
        for (let v = 1; v <= 5; v++) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = String(v);
          b.onclick = () => {
            state.answers[id] = { value: v };
            row.querySelectorAll('button').forEach((x, i) => x.classList.toggle('on', i + 1 === v));
          };
          row.appendChild(b);
        }
        wrap.appendChild(row);
      } else if (q.type === 'NPS') {
        const row = document.createElement('div');
        row.className = 'nps';
        for (let v = 0; v <= 10; v++) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = String(v);
          b.onclick = () => {
            state.answers[id] = { value: v };
            row.querySelectorAll('button').forEach((x) => x.classList.toggle('on', Number(x.textContent) === v));
          };
          row.appendChild(b);
        }
        wrap.appendChild(row);
      } else if (q.type === 'BOOLEAN') {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.gap = '10px';
        [['Sim', true], ['Não', false]].forEach(([label, val]) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          b.style.width = 'auto';
          b.style.padding = '0 16px';
          b.style.height = '44px';
          b.style.borderRadius = '12px';
          b.style.border = '2px solid var(--border)';
          b.style.background = 'var(--card)';
          b.style.fontWeight = '800';
          b.style.cursor = 'pointer';
          b.onclick = () => {
            state.answers[id] = { value: val };
            row.querySelectorAll('button').forEach((x) => x.classList.remove('on'));
            b.classList.add('on');
          };
          row.appendChild(b);
        });
        wrap.appendChild(row);
      } else if (q.type === 'TEXT') {
        const ta = document.createElement('textarea');
        ta.placeholder = 'Sua resposta';
        ta.oninput = () => { state.answers[id] = { text: ta.value }; };
        wrap.appendChild(ta);
      } else {
        const ta = document.createElement('textarea');
        ta.placeholder = 'Resposta';
        ta.oninput = () => { state.answers[id] = { text: ta.value }; };
        wrap.appendChild(ta);
      }
      return wrap;
    }

    async function load() {
      if (!token) {
        document.getElementById('sub').textContent = 'Link inválido (sem token).';
        return;
      }
      try {
        const res = await fetch(API + '/evaluations/public/form?token=' + encodeURIComponent(token));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao carregar');
        state.form = data;
        document.getElementById('sub').textContent =
          (data.templateName || '') +
          (data.osNumber ? ' · OS ' + data.osNumber : '');
        const root = document.getElementById('form-root');
        root.innerHTML = '';
        (data.questions || []).forEach((q) => root.appendChild(renderQuestion(q)));
        const comment = document.createElement('div');
        comment.className = 'card';
        comment.innerHTML = '<label class="q">Comentário opcional</label>';
        const ta = document.createElement('textarea');
        ta.id = 'comment';
        ta.placeholder = 'Compartilhe sua experiência';
        comment.appendChild(ta);
        root.appendChild(comment);
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.type = 'button';
        btn.textContent = 'Enviar avaliação';
        btn.onclick = () => submit(ta.value);
        root.appendChild(btn);
      } catch (e) {
        document.getElementById('sub').textContent = '';
        showErr(e.message || 'Falha ao carregar o formulário.');
      }
    }

    async function submit(comment) {
      showErr('');
      const qs = state.form.questions || [];
      for (const q of qs) {
        if (!q.required) continue;
        if (state.answers[q.id] == null || state.answers[q.id] === '') {
          showErr('Responda todas as perguntas obrigatórias.');
          return;
        }
      }
      const btn = document.querySelector('.btn');
      if (btn) btn.disabled = true;
      try {
        const res = await fetch(API + '/evaluations/public/respond', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, answers: state.answers, comment: comment || undefined }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao enviar');
        document.getElementById('form-root').style.display = 'none';
        document.getElementById('sub').style.display = 'none';
        document.getElementById('title').style.display = 'none';
        document.getElementById('done').style.display = 'block';
      } catch (e) {
        showErr(e.message || 'Erro');
        if (btn) btn.disabled = false;
      }
    }

    load();
  </script>
</body>
</html>
