<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliação de serviço — BrSpark</title>
  <meta name="theme-color" content="#EA580C" />
  <!-- Tokens antes de fontes: variáveis disponíveis para estilos locais -->
  <link rel="stylesheet" href="css/brspark-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: var(--color-bg);
      --card: var(--color-surface);
      --accent: var(--color-brand-accent);
      --text: var(--color-slate);
      --muted: var(--color-text-light);
      --border: var(--color-border);
      --ok-fg: var(--color-status-success-fg);
      --err-fg: var(--color-status-danger-fg);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 48px;
      line-height: 1.5;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }
    label.q { display: block; font-weight: 700; margin-bottom: 10px; font-size: 0.95rem; }
    .stars { display: flex; gap: 8px; flex-wrap: wrap; }
    .stars button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .stars button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .stars button.on { border-color: var(--accent); background: var(--color-status-warning-bg); color: var(--accent); }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: var(--card);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, #fff); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: var(--err-fg); font-size: 0.9rem; margin-top: 8px; }
    .ok { color: var(--ok-fg); font-weight: 700; padding: 16px; text-align: center; }
    .nps { display: flex; flex-wrap: wrap; gap: 6px; }
    .nps button {
      min-width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-weight: 700;
    }
    .nps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nps button.on { background: var(--color-status-warning-bg); border-color: var(--accent); color: var(--accent); }
    .survey-preview-banner {
      background: var(--color-status-warning-bg, #FFEDD5);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }
    .survey-brand { margin-bottom: 8px; }
    .survey-logo-wrap { text-align: center; margin-bottom: 14px; }
    .survey-logo-wrap img { max-height: 72px; max-width: 100%; object-fit: contain; }
    .survey-pre {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 18px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="survey-preview-banner" class="survey-preview-banner" style="display:none"></div>
    <div id="survey-brand" class="survey-brand" style="display:none">
      <div id="survey-logo-wrap" class="survey-logo-wrap" style="display:none"></div>
      <div id="survey-pre" class="survey-pre" style="display:none"></div>
    </div>
    <h1 id="title">Avaliação de serviço</h1>
    <p class="sub" id="sub">Carregando…</p>
    <div id="form-root"></div>
    <p class="err" id="err" style="display:none"></p>
    <div id="done" class="ok" style="display:none">Obrigado. Sua avaliação foi registrada.</div>
  </div>
  <script type="module" src="js/evaluation-survey-page.js"></script>
</body>
</html>
