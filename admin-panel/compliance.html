<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrSpark Admin — Compliance LGPD</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* ── Cards ─────────────────────────────────────────── */
    .doc-card { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:10px; transition:box-shadow .15s; }
    .doc-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .doc-card-header { display:flex; align-items:flex-start; gap:12px; }
    .doc-content-preview { font-size:11px; color:var(--text3); line-height:1.5; max-height:48px; overflow:hidden; margin-top:8px; }

    /* ── Type sections ──────────────────────────────────── */
    .type-section { margin-bottom:32px; }
    .type-section-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
    .type-section-title { font-size:15px; font-weight:900; color:var(--text); flex:1; }

    /* ── History timeline ───────────────────────────────── */
    .history-panel { display:none; background:var(--surface3,var(--bg)); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin-top:10px; }
    .history-panel.open { display:block; }
    .history-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--divider,var(--border)); font-size:12px; }
    .history-row:last-child { border-bottom:none; }
    .history-row .ver { font-weight:800; color:var(--text); min-width:56px; }
    .history-row .hist-title { flex:1; color:var(--text2,var(--text)); }
    .history-row .hist-date { color:var(--text3); min-width:100px; text-align:right; }
    .history-row .hist-accepts { color:var(--text3); min-width:80px; text-align:right; }
    .history-row .hist-actions { display:flex; gap:4px; margin-left:4px; }

    /* ── Editor overlay ─────────────────────────────────── */
    .editor-overlay { display:none; position:fixed; inset:0; background:var(--bg); z-index:200; padding:24px; overflow-y:auto; }
    .editor-overlay.open { display:block; }
    textarea.editor { width:100%; height:420px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:16px; color:var(--text); font-family:monospace; font-size:13px; line-height:1.6; resize:vertical; outline:none; box-sizing:border-box; }
    textarea.editor:focus { border-color:var(--accent); }

    /* ── Version badge ──────────────────────────────────── */
    .ver-active { background:var(--green-dim,#d1fae5); color:var(--green,#059669); }
    .ver-draft  { background:var(--surface3,#f1f5f9); color:var(--text3); }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">Compliance &amp; LGPD</span>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openEditor(null)">+ Nova Versão</button>
      </div>
    </div>
    <div class="page-body">

      <!-- Stats -->
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
        <div class="stat-card" style="--accent-color:var(--green)"><div class="stat-icon" style="background:var(--green-dim);color:var(--green)"><ion-icon name="shield-checkmark-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon></div><div class="stat-value" id="stat-docs">—</div><div class="stat-label">Versões Totais</div></div>
        <div class="stat-card" style="--accent-color:var(--blue)"><div class="stat-icon" style="background:var(--blue-dim);color:var(--blue)"><ion-icon name="checkmark-circle" style="color:var(--green);vertical-align:-2px"></ion-icon></div><div class="stat-value" id="stat-active">—</div><div class="stat-label">Docs Ativos</div></div>
        <div class="stat-card" style="--accent-color:var(--accent)"><div class="stat-icon" style="background:var(--accent-dim);color:var(--accent)"><ion-icon name="people-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon></div><div class="stat-value" id="stat-acceptances">—</div><div class="stat-label">Aceitações registradas</div></div>
        <div class="stat-card" style="--accent-color:var(--amber)"><div class="stat-icon" style="background:var(--amber-dim);color:var(--amber)"><ion-icon name="calendar-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon></div><div class="stat-value" id="stat-last">—</div><div class="stat-label">Última Publicação</div></div>
      </div>

      <div id="docs-list"><div style="color:var(--text3);text-align:center;padding:40px">Carregando…</div></div>
    </div>
  </div>
</div>

<!-- Editor Overlay -->
<div class="editor-overlay" id="editor-overlay">
  <div style="max-width:820px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <button class="btn btn-ghost" onclick="closeEditor()">← Voltar</button>
      <h2 style="flex:1;font-size:18px;font-weight:900" id="editor-title">Nova Versão</h2>
      <button class="btn btn-ghost btn-sm" id="btn-save-draft">Salvar Rascunho</button>
      <button class="btn btn-primary" id="btn-publish">Publicar</button>
    </div>
    <div id="editor-error" style="display:none;background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px"></div>
    <input type="hidden" id="editor-doc-id" />
    <div class="grid-2" style="margin-bottom:16px">
      <div class="form-group"><label class="form-label">Tipo</label>
        <select class="form-control" id="editor-type">
          <option value="TERMS_OF_USE">Termos de Uso</option>
          <option value="PRIVACY_POLICY">Política de Privacidade</option>
          <option value="LGPD_DPA">DPA — LGPD</option>
          <option value="COOKIE_POLICY">Política de Cookies</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Versão</label><input class="form-control" id="editor-version" placeholder="Ex: 2.0" /></div>
    </div>
    <div class="form-group"><label class="form-label">Título</label><input class="form-control" id="editor-doc-title" placeholder="Título completo do documento" /></div>
    <div class="form-group"><label class="form-label">Conteúdo (Markdown)</label><textarea class="editor" id="editor-content" placeholder="# Título&#10;&#10;Escreva o conteúdo em Markdown..."></textarea></div>
  </div>
</div>

<script type="module">
  import { initPage } from './js/sidebar.js';
  import { CONFIG } from './js/config.js';
  await initPage();

  const typeMap = { TERMS_OF_USE:'badge-green', PRIVACY_POLICY:'badge-blue', LGPD_DPA:'badge-accent', COOKIE_POLICY:'badge-amber' };
  const typeLbl = { TERMS_OF_USE:'Termos de Uso', PRIVACY_POLICY:'Política de Privacidade', LGPD_DPA:'DPA LGPD', COOKIE_POLICY:'Cookies' };

  // ── Group docs by type ───────────────────────────────────────────────────────
  function groupByType(docs) {
    const order = ['TERMS_OF_USE', 'PRIVACY_POLICY', 'LGPD_DPA', 'COOKIE_POLICY'];
    const map = {};
    docs.forEach(d => { if (!map[d.type]) map[d.type] = []; map[d.type].push(d); });
    return order.filter(t => map[t]?.length).map(t => ({ type: t, docs: map[t] }));
  }

  // ── Render history timeline for a type ──────────────────────────────────────
  function renderHistory(docs) {
    // docs sorted newest-first by createdAt
    const sorted = [...docs].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    return sorted.map((d, i) => `
      <div class="history-row">
        <span class="ver">v${d.version}</span>
        <span class="badge ${d.isActive ? 'badge-green ver-active' : 'badge-gray ver-draft'}" style="font-size:9px">
          ${d.isActive ? '<ion-icon name="ellipse-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Vigente' : i === 0 && !d.isActive ? 'Rascunho' : 'Expirado'}
        </span>
        <span class="hist-title">${d.title}</span>
        <span class="hist-accepts">${d._count?.acceptances || 0} aceitações</span>
        <span class="hist-date">${d.publishedAt ? new Date(d.publishedAt).toLocaleDateString('pt-BR') : d.isActive ? '—' : new Date(d.createdAt).toLocaleDateString('pt-BR')}</span>
        <div class="hist-actions">
          <button class="btn btn-ghost btn-sm" style="font-size:10px" onclick="editDoc('${d.id}')">Editar</button>
          ${!d.isActive ? `<button class="btn btn-success btn-sm" style="font-size:10px" onclick="publish('${d.id}', this)">Publicar</button>` : ''}
          ${!d.isActive ? `<button class="btn btn-danger btn-sm" style="font-size:10px" onclick="deleteDoc('${d.id}', '${d.title.replace(/'/g,"\\'")}', this)"><ion-icon name="trash-outline" style="vertical-align:-2px"></ion-icon></button>` : ''}
        </div>
      </div>`).join('');
  }

  // ── Render grouped sections ──────────────────────────────────────────────────
  function renderDocs(docs) {
    const groups = groupByType(docs);
    if (!groups.length) return '<div style="text-align:center;padding:40px;color:var(--text3)">Nenhum documento cadastrado.</div>';
    return groups.map(({ type, docs: typeDocs }) => {
      const active = typeDocs.find(d => d.isActive);
      const versionsCount = typeDocs.length;
      return `
        <div class="type-section">
          <div class="type-section-header">
            <span class="badge ${typeMap[type]}">${typeLbl[type]}</span>
            <span class="type-section-title">${active ? active.title : 'Sem versão ativa'}</span>
            <span style="font-size:11px;color:var(--text3);margin-right:4px">${versionsCount} versão${versionsCount > 1 ? 'ões' : ''}</span>
            ${active ? `<span class="badge badge-green" style="font-size:10px"><ion-icon name="ellipse-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Vigente: v${active.version}</span>` : '<span class="badge badge-amber" style="font-size:10px"><ion-icon name="warning-outline" style="color:var(--amber);vertical-align:-2px"></ion-icon> Sem versão ativa</span>'}
            <button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="toggleHistory('${type}')"><ion-icon name="clipboard-outline" style="vertical-align:-2px"></ion-icon> Histórico</button>
            <button class="btn btn-primary btn-sm" style="font-size:11px" onclick="openEditor('${type}')">+ Nova Versão</button>
          </div>

          ${active ? `
          <div class="doc-card" style="border-left:3px solid var(--green)">
            <div class="doc-card-header">
              <div style="flex:1">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                  <span style="font-size:13px;font-weight:800;color:var(--text)">${active.title}</span>
                  <span style="font-size:9px;color:var(--text3)">v${active.version}</span>
                </div>
                <div style="font-size:10px;color:var(--text3)">
                  Publicado: ${active.publishedAt ? new Date(active.publishedAt).toLocaleDateString('pt-BR') : '—'}
                  &nbsp;·&nbsp; ${active._count?.acceptances || 0} aceitações registradas
                </div>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="editDoc('${active.id}')">Editar Vigente</button>
            </div>
            <div class="doc-content-preview">${(active.content || '').slice(0, 220)}…</div>
          </div>` : ''}

          <!-- Histórico de versões (colapsável) -->
          <div class="history-panel" id="hist-${type}">
            <div style="font-size:11px;font-weight:800;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">
              Histórico de Vigência — ${typeLbl[type]}
            </div>
            <div style="display:flex;gap:6px;font-size:10px;font-weight:700;color:var(--text3);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:4px">
              <span style="min-width:56px">Versão</span>
              <span style="min-width:64px">Status</span>
              <span style="flex:1">Título</span>
              <span style="min-width:80px;text-align:right">Aceitações</span>
              <span style="min-width:100px;text-align:right">Data</span>
              <span style="min-width:100px">Ações</span>
            </div>
            ${renderHistory(typeDocs)}
          </div>
        </div>`;
    }).join('');
  }

  // ── Load ─────────────────────────────────────────────────────────────────────
  async function loadDocs() {
    const docs = await CONFIG.get('/compliance');
    if (!docs) return;
    document.getElementById('stat-docs').textContent = docs.length;
    document.getElementById('stat-active').textContent = docs.filter(d => d.isActive).length;
    document.getElementById('stat-acceptances').textContent = docs.reduce((s, d) => s + (d._count?.acceptances || 0), 0);
    const published = docs.filter(d => d.publishedAt).sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
    document.getElementById('stat-last').textContent = published[0] ? new Date(published[0].publishedAt).toLocaleDateString('pt-BR') : '—';
    document.getElementById('docs-list').innerHTML = renderDocs(docs);
  }

  loadDocs();

  // ── Toggle history panel ──────────────────────────────────────────────────────
  window.toggleHistory = (type) => {
    const p = document.getElementById(`hist-${type}`);
    p.classList.toggle('open');
  };

  // ── Publish ──────────────────────────────────────────────────────────────────
  window.publish = async (id, btn) => {
    if (btn.dataset.confirming) {
      btn.disabled = true; btn.textContent = 'Publicando…';
      await CONFIG.patch(`/compliance/${id}/publish`, {});
      loadDocs();
    } else {
      btn.dataset.confirming = '1'; btn.textContent = 'Confirmar?';
      btn.classList.replace('btn-success', 'btn-danger');
      setTimeout(() => {
        if (btn.dataset.confirming) {
          delete btn.dataset.confirming; btn.textContent = 'Publicar';
          btn.classList.replace('btn-danger', 'btn-success');
        }
      }, 3000);
    }
  };

  // ── Delete ───────────────────────────────────────────────────────────────────
  window.deleteDoc = async (id, title, btn) => {
    if (btn.dataset.confirming) {
      btn.disabled = true; btn.textContent = '…';
      const res = await CONFIG.delete(`/compliance/${id}`);
      if (res?.error) { alert('Erro: ' + res.error); btn.disabled = false; btn.textContent = '<ion-icon name="trash-outline" style="vertical-align:-2px"></ion-icon>'; delete btn.dataset.confirming; return; }
      loadDocs();
    } else {
      btn.dataset.confirming = '1'; btn.textContent = '<ion-icon name="checkmark-outline" style="vertical-align:-2px"></ion-icon> Excluir?';
      btn.classList.replace('btn-danger', 'btn-warning');
      setTimeout(() => {
        if (btn.dataset.confirming) {
          delete btn.dataset.confirming; btn.textContent = '<ion-icon name="trash-outline" style="vertical-align:-2px"></ion-icon>';
          btn.classList.replace('btn-warning', 'btn-danger');
        }
      }, 3000);
    }
  };

  // ── Edit ─────────────────────────────────────────────────────────────────────
  window.editDoc = async (id) => {
    const doc = await CONFIG.get(`/compliance/${id}`);
    if (!doc) return;
    document.getElementById('editor-doc-id').value     = doc.id;
    document.getElementById('editor-title').textContent = 'Editando: ' + doc.title;
    document.getElementById('editor-type').value       = doc.type;
    document.getElementById('editor-version').value    = doc.version;
    document.getElementById('editor-doc-title').value  = doc.title;
    document.getElementById('editor-content').value    = doc.content;
    document.getElementById('editor-type').disabled    = true;  // tipo não muda em edição
    document.getElementById('editor-overlay').classList.add('open');
  };

  // ── Open for new version ─────────────────────────────────────────────────────
  window.openEditor = (presetType) => {
    document.getElementById('editor-doc-id').value     = '';
    document.getElementById('editor-title').textContent = 'Nova Versão';
    document.getElementById('editor-type').value       = presetType || 'TERMS_OF_USE';
    document.getElementById('editor-type').disabled    = !!presetType;
    document.getElementById('editor-version').value    = '';
    document.getElementById('editor-doc-title').value  = '';
    document.getElementById('editor-content').value    = '';
    document.getElementById('editor-error').style.display = 'none';
    document.getElementById('editor-overlay').classList.add('open');
  };

  window.closeEditor = () => {
    document.getElementById('editor-type').disabled = false;
    document.getElementById('editor-overlay').classList.remove('open');
  };

  // ── Save ─────────────────────────────────────────────────────────────────────
  async function saveDoc(shouldPublish) {
    const id      = document.getElementById('editor-doc-id').value.trim();
    const version = document.getElementById('editor-version').value.trim();
    const title   = document.getElementById('editor-doc-title').value.trim();
    const content = document.getElementById('editor-content').value.trim();
    const type    = document.getElementById('editor-type').value;
    const errEl   = document.getElementById('editor-error');
    const pubBtn  = document.getElementById('btn-publish');
    const dftBtn  = document.getElementById('btn-save-draft');

    errEl.style.display = 'none';
    if (!version || !title || !content) {
      errEl.textContent = '<ion-icon name="warning-outline" style="font-size:16px;vertical-align:middle;margin-right:8px"></ion-icon> Preencha Versão, Título e Conteúdo antes de salvar.';
      errEl.style.display = 'block'; return;
    }

    pubBtn.disabled = dftBtn.disabled = true;
    pubBtn.textContent = shouldPublish ? 'Publicando…' : 'Salvando…';

    try {
      let res;
      if (id) {
        res = await CONFIG.patch(`/compliance/${id}`, { version, title, content });
        if (res?.error) throw new Error(res.error);
        if (shouldPublish) {
          const pub = await CONFIG.patch(`/compliance/${id}/publish`, {});
          if (pub?.error) throw new Error(pub.error);
        }
      } else {
        res = await CONFIG.post('/compliance', { type, version, title, content, publish: shouldPublish });
        if (res?.error) throw new Error(res.error);
      }
      closeEditor();
      loadDocs();
    } catch (err) {
      errEl.textContent = '<ion-icon name="close-circle" style="color:var(--red);vertical-align:-2px"></ion-icon> ' + (err.message || 'Erro ao salvar. Tente novamente.');
      errEl.style.display = 'block';
    } finally {
      pubBtn.disabled = dftBtn.disabled = false;
      pubBtn.textContent = 'Publicar';
      dftBtn.textContent = 'Salvar Rascunho';
    }
  }

  document.getElementById('btn-save-draft').addEventListener('click', () => saveDoc(false));
  document.getElementById('btn-publish').addEventListener('click', () => saveDoc(true));
</script>
</body>
</html>
